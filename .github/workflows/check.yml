name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha: {description: Expected release PR head, required: false}
permissions:
  contents: read
jobs:
  check:
    name: Check (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64, runtime_arch: arm64}
          - {runner: macos-15-intel, arch: x86_64, runtime_arch: x64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - if: inputs.expected_sha != ''
        env: {EXPECTED_SHA: '${{ inputs.expected_sha }}'}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - run: python3 scripts/test-release-tools.py
      - name: Require the published compatible core runtime
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p "$RUNNER_TEMP/core"
          gh release download --repo tader/switchboard -p 'runtime-darwin-${{ matrix.runtime_arch }}.json' -p 'switchboard-runtime-darwin-${{ matrix.runtime_arch }}.tar.gz' -D "$RUNNER_TEMP/core"
          python3 scripts/prepare-smoke-runtime.py "$RUNNER_TEMP/core" '${{ matrix.runtime_arch }}'
      - name: Download the affected runtime
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p "$RUNNER_TEMP/affected-core"
          gh release download v0.17.0 --repo tader/switchboard -p 'runtime-darwin-${{ matrix.runtime_arch }}.json' -p 'switchboard-runtime-darwin-${{ matrix.runtime_arch }}.tar.gz' -D "$RUNNER_TEMP/affected-core"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tader/switchboard
          ref: f759fbc7dbfd08f60ac85a848c1f10f35b0b70cd
          path: .core-repair
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - name: Build the pinned repair runtime archive
        working-directory: .core-repair
        run: |
          npm ci
          npm ci --prefix web
          npm run build --prefix web
          bash scripts/download-runtime-node.sh '${{ matrix.runtime_arch }}' "$RUNNER_TEMP/node"
          python3 scripts/package-runtime.py --node "$RUNNER_TEMP/node/node-v24.22.3-darwin-${{ matrix.runtime_arch }}/bin/node" --arch '${{ matrix.runtime_arch }}' --revision "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/fixed-core"
      - run: swift test
        env:
          SWITCHBOARD_TEST_RUNTIME_ASSETS: ${{ runner.temp }}/core
          SWITCHBOARD_TEST_FIXED_RUNTIME_ASSETS: ${{ runner.temp }}/fixed-core
          SWITCHBOARD_TEST_AFFECTED_RUNTIME_ASSETS: ${{ runner.temp }}/affected-core
          SWITCHBOARD_UI_SNAPSHOT_DIR: ${{ runner.temp }}/ui
      - run: bash scripts/bundle.sh '${{ matrix.arch }}'
      - run: python3 scripts/test-app-update-configuration.py
      - run: python3 scripts/test-app-updates.py
        env: {SWITCHBOARD_TEST_APP_ARCH: '${{ matrix.arch }}'}
      - name: Exercise the relocated packaged app
        run: python3 scripts/smoke-app.py --app '.dist/${{ matrix.arch }}/Switchboard.app' --runtime "$RUNNER_TEMP/core/runtime" --seed-data "$RUNNER_TEMP/core/seed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-${{ matrix.arch }}
          path: .dist/*-unsigned.zip
          include-hidden-files: true
          if-no-files-found: error
