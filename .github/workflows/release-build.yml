name: Native release build
on:
  workflow_dispatch:
    inputs:
      tag: {description: Existing native release tag, required: true}
      core_tag: {description: Compatible core release tag (blank uses latest stable), required: false}
      sign: {description: Sign and notarize with configured Developer ID secrets, type: boolean, default: false}
  workflow_call:
    inputs:
      tag: {type: string, required: true}
      core_tag: {type: string, default: ''}
      sign: {type: boolean, default: false}
    secrets:
      DEVELOPER_ID_CERTIFICATE: {required: false}
      DEVELOPER_ID_PASSWORD: {required: false}
      SIGNING_IDENTITY: {required: false}
      NOTARY_KEY: {required: false}
      NOTARY_KEY_ID: {required: false}
      NOTARY_ISSUER: {required: false}
      SPARKLE_PRIVATE_KEY: {required: false}
permissions:
  contents: write
concurrency:
  group: native-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      core_tag: ${{ steps.core.outputs.tag }}
    steps:
      - name: Require the update signing key for signed releases
        if: inputs.sign
        env: {SPARKLE_PRIVATE_KEY: '${{ secrets.SPARKLE_PRIVATE_KEY }}'}
        run: test -n "$SPARKLE_PRIVATE_KEY"
      - name: Select one core release for both architectures
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_TAG: ${{ inputs.core_tag }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GH_REPO" >/dev/null
          args=()
          if [[ -n "$CORE_TAG" ]]; then args+=("$CORE_TAG"); fi
          core_tag=$(gh release view "${args[@]}" --repo tader/switchboard --json tagName --jq .tagName)
          [[ "$core_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          echo "tag=$core_tag" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64, runtime_arch: arm64}
          - {runner: macos-15-intel, arch: x86_64, runtime_arch: x64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ inputs.tag }}'}
      - name: Require published core assets before native release
        env: {GH_TOKEN: '${{ github.token }}', CORE_TAG: '${{ needs.prepare.outputs.core_tag }}'}
        run: |
          mkdir -p "$RUNNER_TEMP/core"
          gh release download "$CORE_TAG" -R tader/switchboard -p 'runtime-darwin-${{ matrix.runtime_arch }}.json' -D "$RUNNER_TEMP/core"
          gh release download "$CORE_TAG" -R tader/switchboard -p 'switchboard-runtime-darwin-${{ matrix.runtime_arch }}.tar.gz' -D "$RUNNER_TEMP/core"
          python3 scripts/prepare-smoke-runtime.py "$RUNNER_TEMP/core" '${{ matrix.runtime_arch }}'
      - run: swift test
        env:
          SWITCHBOARD_TEST_RUNTIME_ASSETS: ${{ runner.temp }}/core
          SWITCHBOARD_UI_SNAPSHOT_DIR: ${{ runner.temp }}/ui
      - run: bash scripts/bundle.sh '${{ matrix.arch }}'
      - run: python3 scripts/test-app-update-configuration.py
      - run: python3 scripts/test-app-updates.py
        env: {SWITCHBOARD_TEST_APP_ARCH: '${{ matrix.arch }}'}
      - name: Exercise the packaged app
        run: python3 scripts/smoke-app.py --app '.dist/${{ matrix.arch }}/Switchboard.app' --runtime "$RUNNER_TEMP/core/runtime" --seed-data "$RUNNER_TEMP/core/seed"
      - name: Sign and notarize
        if: inputs.sign
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: bash scripts/sign-release.sh '${{ matrix.arch }}'
      # Build the tagged app, but use publication tooling from this workflow's
      # revision so a manual retry can repair publishing without moving a tag.
      - name: Check out current publication tooling
        if: inputs.sign
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
      - name: Generate and verify signed app update feed
        if: inputs.sign
        env: {SPARKLE_PRIVATE_KEY: '${{ secrets.SPARKLE_PRIVATE_KEY }}', TAG: '${{ inputs.tag }}'}
        run: python3 .release-tools/scripts/publish-appcast.py '${{ matrix.arch }}' --tag "$TAG"
      - name: Publish verified release assets
        env: {GH_TOKEN: '${{ github.token }}', TAG: '${{ inputs.tag }}', SIGNED: '${{ inputs.sign }}'}
        run: |
          assets=(.dist/*.zip)
          if [[ "$SIGNED" == 'true' ]]; then assets+=(.dist/appcast-${{ matrix.arch }}.xml); fi
          gh release upload "$TAG" "${assets[@]}" --clobber
